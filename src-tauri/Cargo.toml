[package]
name = "gravityforge"
version = "0.1.0"
description = "Local-first agentic development environment"
authors = ["GravityForge contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gravityforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
ignore = "0.4"
content_inspector = "0.2"
portable-pty = "0.9"
libc = "0.2"
tempfile = "3"
globset = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

